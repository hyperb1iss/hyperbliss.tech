overrides:
  # Security advisories on transitive deps (pnpm audit --prod gates CI).
  "postcss@<8.5.23": ">=8.5.23"
  "sharp@<0.35.4": ">=0.35.4 <0.36"
  "@hono/node-server@<2.0.5": ">=2.0.5 <3"
  "brace-expansion@>=5.0.0 <5.0.9": ">=5.0.9 <6"
  "nanoid@<3.3.18": ">=3.3.18"
  "baseline-browser-mapping@<2.11.0": ">=2.11.0"
  "smol-toml@<=1.7.0": ">=1.7.1"
  "dompurify@<3.4.13": ">=3.4.13"
  "js-yaml@>=3.0.0 <3.15.2": ">=3.15.2 <4"

allowBuilds:
  # just-bash's optional Node compression backends — we only ship its browser
  # bundle, which doesn't use them, so skip building the native modules.
  "@mongodb-js/zstd": false
  esbuild: true
  node-liblzma: false
  sharp: true

