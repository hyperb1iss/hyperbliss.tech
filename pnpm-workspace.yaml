  - "@next/swc-linux-arm64-gnu@16.3.0-canary.93"
  - "@next/swc-linux-arm64-musl@16.3.0-canary.93"
  - "@next/swc-linux-x64-gnu@16.3.0-canary.93"
  - "@next/swc-linux-x64-musl@16.3.0-canary.93"
  - "@next/swc-win32-arm64-msvc@16.3.0-canary.93"
  - "@next/swc-win32-x64-msvc@16.3.0-canary.93"
